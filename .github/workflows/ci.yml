name: Verify

on:
  push:
    paths-ignore:
      - 'src/config/models.json'
      - 'docs/model-catalog.md'
  pull_request:
    paths-ignore:
      - 'src/config/models.json'
      - 'docs/model-catalog.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Install browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Check dashboard with mock data
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:ui
      - name: Check configuration editor drafts
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:editor
      - name: Check runtime model catalogue and prices
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:models
      - name: Check optional engine settings and checkbox layout
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:options
      - name: Check archived history and mixed-provider comparison
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:history
      - name: Check independent finding review edits
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:findings
      - name: Check run deletion, filters and saved settings
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:management
      - name: Check bulk deletion and filtered selection
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:bulk-delete
      - name: Check AI world engine and saved world state
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:world
      - name: Check distributed spaces and optional situations
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:spatial
      - name: Check browser API keys with local transport
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run smoke:keys
      - name: Check offline character gallery
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npm run assets:gallery
